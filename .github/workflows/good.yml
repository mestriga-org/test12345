# This workflow is managed by gh actions-lock.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: main
jobs:
  D:
    runs-on: ubuntu-slim
    if: true
    steps:
      - run: echo D
  A:
    needs: [D]
    runs-on: ubuntu-slim
    if: false
    steps:
      - run: echo A
  B:
    runs-on: ubuntu-latest
    if: false
    steps:
      - run: echo B
  C:
    runs-on: ubuntu-latest
    needs: [A,B]
    if: ${{ !cancelled() && needs.D.result == 'success' }}
    steps:
      - run: echo C
