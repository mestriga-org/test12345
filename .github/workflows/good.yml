# This workflow is managed by gh actions-lock.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: main
jobs:
  A:
    uses: $/.github/workflows/reusable.yml
  delay:
    runs-on: ubuntu-slim
    steps:
      - run: sleep 1
  cancel:
    needs: delay
    uses: $/.github/workflows/reusable.yml
