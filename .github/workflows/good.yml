# This workflow is managed by gh actions-lock.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: main
jobs:
  first:
    uses: $/.github/workflows/reusable.yml
  second:
    uses: $/.github/workflows/reusable.yml
  third:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const run_id = context.runId;
            const response = await octokit.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run_id,
            });
            // Extract status and conclusion
            const { status, conclusion } = response.data;
            console.log(`Current Run Status: ${status}`);       // e.g., "in_progress", "queued"
            console.log(`Current Run Conclusion: ${conclusion}`); // e.g., null (if running), "success", "failure"
