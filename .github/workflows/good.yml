# This workflow is managed by gh actions-lock.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: main
jobs:
  skips:
    continue-on-error: true
    runs-on: ubuntu-slim
    steps:
      - run: false
  depend:
    needs: skips
    if: (!cancelled()) && needs.skips.result == 'success'
    runs-on: ubuntu-slim
    steps:
      - run: echo ${{ needs.skips.result }}
