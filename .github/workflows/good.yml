# This workflow is managed by gh actions-lock.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: main
jobs:
  first:
    uses: $/.github/workflows/reusable.yml
  delay:
    runs-on: ubuntu-slim
    steps:
      - run: sleep 1
  second:
    needs: delay
    uses: $/.github/workflows/reusable.yml
  third:
    needs:
      - first
    runs-on: ubuntu-slim
    if: (!cancelled() && (failure() || needs.first.result == 'cancelled'))
    steps:
      - run: exit 1
