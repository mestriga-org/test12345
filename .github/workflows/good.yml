# This workflow is managed by gh actions-lock.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: main
jobs:
  first:
    uses: $/.github/workflows/reusable2.yml
  third:
    needs:
      - first
    runs-on: ubuntu-slim
    if: (!cancelled() && (failure() || contains(needs.*.result, 'cancelled')))
    steps:
      - run: exit 1
