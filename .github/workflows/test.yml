on:
  workflow_dispatch:
permissions: { }
jobs:
  bam:
    permissions: { id-token: write }
    runs-on: ubuntu-slim
    steps:
      - run: |
          curl -H "Authorization: Bearer ${GH_TOKEN}" "https://octo-sts.dev/sts/exchange?scope=${{ github.repository }}&identity=use-action"
        env:
          GH_TOKEN: ${{ github.token }}
      - id: octo-sts
        uses: octo-sts/action@v1.1.1
        with:
          scope: ${{ github.repository }}
          identity: use-action
