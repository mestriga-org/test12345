
on:
  workflow_dispatch:
permissions: { }
jobs:
  bam:
    runs-on: ubuntu-slim
    steps:
      - shell: bash
        env:
          arg_1: ${{ github.token  }}
        run: |-
          set -Cfu -o posix
          set -- "${arg_1}"; unset -v arg_1
          case ${1:?} in (ghs_*_*) ;; (*) command -p false; esac
          IFS=.; set -- ${1#*_*_}''; unset -v IFS
          case $# in (3) ;; (*) command -p false; esac
          command -p printf %s "${2:?}" | exec basenc -d --base64url
