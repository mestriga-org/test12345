# This workflow is managed by gh actions-lock.

on:
  workflow_call:
concurrency:
    group: reusable
    cancel-in-progress: true
jobs:
  child-check:
    runs-on: ubuntu-slim
    steps:
      - run: sleep 10
  cancelled:
    needs: child-check
    if: cancelled()
    runs-on: ubuntu-slim
    steps:
      - run: echo always
